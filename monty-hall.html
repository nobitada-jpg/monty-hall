<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>モンティ・ホール問題</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f4f6fb;color:#182033;text-align:center}
main{max-width:680px;margin:auto;padding:22px 16px}
h1{font-size:1.7rem;margin:8px 0}
p{line-height:1.7}
.doors{display:flex;gap:12px;justify-content:center;margin:26px 0}
.door{width:29%;min-height:150px;border:0;border-radius:14px;background:#2456a6;color:white;font-size:1.1rem;font-weight:bold;box-shadow:0 4px 0 #17396f}
.door:disabled{opacity:1}
.door.open{background:#fff;color:#182033;border:3px solid #b8c2d6;box-shadow:none}
button.action{border:0;border-radius:10px;padding:13px 20px;margin:6px;background:#16845b;color:white;font-size:1rem;font-weight:bold}
button.secondary{background:#5b6475}
#message{font-weight:bold;min-height:3em}
.panel{background:white;border-radius:14px;padding:16px;margin:18px 0;box-shadow:0 2px 10px #0001}
small{color:#596579}
</style>
</head>
<body><main>
<h1>🚪 モンティ・ホール問題</h1>
<p>3つのドアのうち1つに車、残り2つにヤギがいます。<br>ドアを1つ選ぶと、司会者がヤギのドアを1つ開けます。</p>
<div class="doors" id="doors">
<button class="door" onclick="pick(0)">ドア 1</button>
<button class="door" onclick="pick(1)">ドア 2</button>
<button class="door" onclick="pick(2)">ドア 3</button>
</div>
<div id="message">まず、好きなドアを1つ選んでください。</div>
<div id="actions"></div>
<div class="panel">
<h3>実験してみよう</h3>
<button class="action" onclick="simulate(10)">10回</button>
<button class="action" onclick="simulate(100)">100回</button>
<button class="action" onclick="simulate(1000)">1,000回</button>
<button class="action" onclick="simulate(10000)">10,000回</button>
<p id="stats">まだ実験していません。</p>
</div>
<div class="panel">
<h3>なぜ「変更する」と有利？</h3>
<p>最初に当たりを選ぶ確率は <b>1/3</b>。外れを選ぶ確率は <b>2/3</b> です。<br>
司会者は必ずヤギのドアを開けるため、最初に外れを選んでいた場合、残ったドアに変更すれば当たりです。<br><b>そのため、変更する確率は2/3、変更しない確率は1/3です。</b></p>
</div>
<button class="action secondary" onclick="reset()">最初からやり直す</button>
<small><p>※司会者は正解を知っていて、必ずヤギのドアを開けるルールです。</p></small>
</main>
<script>
let prize,chosen,opened,stage=0;
const buttons=[...document.querySelectorAll('.door')];
function pick(n){
 if(stage!==0)return;
 chosen=n; prize=Math.floor(Math.random()*3);
 let goats=[0,1,2].filter(x=>x!==chosen&&x!==prize);
 opened=goats[Math.floor(Math.random()*goats.length)];
 buttons[opened].textContent='🐐 ヤギ';
 buttons[opened].classList.add('open');buttons[opened].disabled=true;
 buttons[chosen].textContent='あなたの選択';
 buttons.forEach((b,i)=>{if(i!==opened)b.disabled=true});
 stage=1;
 document.getElementById('message').textContent='司会者がヤギのドアを開けました。選択を変更しますか？';
 document.getElementById('actions').innerHTML='<button class="action" onclick="finish(true)">変更する</button><button class="action secondary" onclick="finish(false)">変更しない</button>';
}
function finish(change){
 let final=change?[0,1,2].find(x=>x!==chosen&&x!==opened):chosen;
 buttons[final].textContent=prize===final?'🚗 あたり！':'🐐 ヤギ';
 buttons[final].classList.add('open');
 buttons.forEach(b=>b.disabled=true);
 document.getElementById('message').textContent=prize===final?'🎉 おめでとう！当たりです。':'残念！今回はハズレです。';
 document.getElementById('actions').innerHTML='<button class="action" onclick="reset()">もう一度挑戦</button>';
 stage=2;
}
function reset(){stage=0;buttons.forEach((b,i)=>{b.textContent='ドア '+(i+1);b.disabled=false;b.classList.remove('open')});document.getElementById('message').textContent='まず、好きなドアを1つ選んでください。';document.getElementById('actions').innerHTML=''}
function simulate(n){let sw=0,stay=0;for(let i=0;i<n;i++){let p=Math.floor(Math.random()*3),c=Math.floor(Math.random()*3);if(p!==c)sw++;else stay++}document.getElementById('stats').innerHTML=`変更する：${sw} / ${n}回（${(sw/n*100).toFixed(1)}%）<br>変更しない：${stay} / ${n}回（${(stay/n*100).toFixed(1)}%）`}
</script>
</body></html>
